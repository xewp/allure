name: Keep Backend Alive

on:
  schedule:
    # Triggered every 14 minutes by GitHub Actions
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Service
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            # Default backend URL on Render (or replace with your live URL)
            URL="https://auraselect-backend.onrender.com/api/health"
          fi
          echo "Pinging backend at: $URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$URL")
          echo "Response: $RESPONSE"
